---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: post-test-cleanup
spec:
  params:
    - name: cleanup-image
      description: >-
        Image with python3 and pulp-cli (Dockerfile.e2e-cleanup). Built in parallel
        with the e2e runner image so cleanup can run when build-e2e-image fails.
      type: string
      default: >-
        quay.io/redhat-user-workloads/artifact-storage-tenant/tooling/pulp-e2e-testing:cleanup-latest
    - name: e2e-run-id
      description: Unique suffix for build-scoped Pulp resources (PipelineRun UID from the pipeline)
      type: string
    - name: ociStorage
      description: OCI registry used for ORAS e2e (must match run-e2e-test-suite for cleanup scope)
      type: string
      default: quay.io/redhat-user-workloads/artifact-storage-tenant/tooling/pulp-e2e-testing
  workspaces:
    - name: repository
  stepTemplate:
    image: $(params.cleanup-image)
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    env:
      - name: HOME
        value: /tmp
      - name: XDG_CACHE_HOME
        value: $(workspaces.repository.path)/.pulp-cli-cache
      - name: PULP_CLI_CONFIG
        value: /etc/pulp-access/cli.toml
      - name: PULP_TOOL_PATH
        value: $(workspaces.repository.path)/source
      - name: E2E_RUN_ID
        value: $(params.e2e-run-id)
  steps:
    - name: post-test-cleanup
      script: |
        #!/usr/bin/env sh
        set -eu

        python3 "${PULP_TOOL_PATH}/e2e/post-test-cleanup.py" \
          --config "${PULP_CLI_CONFIG}" \
          --run-id "${E2E_RUN_ID}" \
          --oci-storage "$(params.ociStorage)"

      volumeMounts:
        - name: cli-toml-volume
          mountPath: /etc/pulp-access
          readOnly: true
  volumes:
    - name: cli-toml-volume
      secret:
        secretName: pulp-access
        items:
          - key: cli.toml
            path: cli.toml
