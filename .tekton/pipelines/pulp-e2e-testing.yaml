apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pulp-e2e-testing
  labels:
    appstudio.openshift.io/application: tooling
    appstudio.openshift.io/component: pulp-e2e-testing
    pipelines.appstudio.openshift.io/type: build
spec:
  params:
    - name: git-url
      description: URL of the Git repository to clone
      type: string
    - name: revision
      description: Git revision to checkout
      type: string
    - name: output-image
      description: Fully qualified image name for the output
      type: string
    - name: image-expires-after
      description: Image expiration time
      type: string
      default: 5d
    - name: dockerfile
      description: Path to the e2e Dockerfile inside the cloned source tree (under source/)
      type: string
      default: Dockerfile.e2e
    - name: path-context
      description: Build context relative to the cloned source tree (Konflux buildah SOURCE_CODE_DIR)
      type: string
      default: .
    - name: enable-cache-proxy
      description: Enable Konflux cache proxy (passed to init; feeds buildah HTTP_PROXY/NO_PROXY)
      type: string
      default: "false"
  workspaces:
    - name: test
      description: Workspace for test artifacts
    - name: repository
      description: Workspace for cloned repository
    - name: git-auth
      description: Git authentication credentials
      optional: true
  tasks:
    - name: init
      params:
        - name: enable-cache-proxy
          value: $(params.enable-cache-proxy)
      taskRef:
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:5f687152ab0661f84830877de93a8ec45cb0b756f71b24ac55133d03a4007936
          - name: kind
            value: task
        resolver: bundles
    - name: clone-repository
      runAfter:
        - init
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      taskRef:
        params:
          - name: name
            value: git-clone
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2.6@sha256:7d5d1ae4cf78c6892cfba764602f9439bc5017c7254a7bb074e598e66916cfb9
          - name: kind
            value: task
        resolver: bundles
      workspaces:
        - name: output
          workspace: repository
        - name: basic-auth
          workspace: git-auth
    - name: build-e2e-image
      runAfter:
        - clone-repository
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: SOURCE_URL
          value: $(params.git-url)
        - name: SKIP_SBOM_GENERATION
          value: "true"
        - name: HTTP_PROXY
          value: $(tasks.init.results.http-proxy)
        - name: NO_PROXY
          value: $(tasks.init.results.no-proxy)
      taskRef:
        params:
          - name: name
            value: buildah
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.12.0@sha256:19fcabb2afd9d8ce7ca10e980b21cfd9a5443266d6a185fdb6b49b1f01475e44
          - name: kind
            value: task
        resolver: bundles
      workspaces:
        - name: source
          workspace: repository
    - name: run-e2e-test-suite
      runAfter:
        - build-e2e-image
      params:
        - name: e2e-image
          value: $(tasks.build-e2e-image.results.IMAGE_REF)
        - name: e2e-run-id
          value: $(context.pipelineRun.uid)
      taskRef:
        resolver: git
        params:
          - name: revision
            value: $(params.revision)
          - name: url
            value: $(params.git-url)
          - name: pathInRepo
            value: .tekton/tasks/run-e2e-test-suite.yaml
      workspaces:
        - name: test
          workspace: test
        - name: repository
          workspace: repository
  finally:
    - name: post-test-cleanup
      params:
        - name: e2e-run-id
          value: $(context.pipelineRun.uid)
      taskRef:
        resolver: git
        params:
          - name: revision
            value: $(params.revision)
          - name: url
            value: $(params.git-url)
          - name: pathInRepo
            value: .tekton/tasks/post-test-cleanup.yaml
      workspaces:
        - name: repository
          workspace: repository
