# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot
#
# Python (pyproject.toml + uv.lock): Mintmaker/Renovate — see
# .github/renovate.json (three-day schedule). No pip ecosystem here to
# avoid duplicate PRs.

version: 2
updates:
  # GitHub Actions - grouped PR (workflows pin uses: to full commit SHAs)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"
