---
# Publish pulp-tool to PyPI when a release tag is pushed to main.
# Maintainer guide: docs/releasing.md
name: Release python package

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-inspect-package:
    name: Build & inspect package.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Pin package version from release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Release version: ${version}"

      - name: Verify release tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH with optional SemVer pre-release" \
              "(-...) and build metadata (+...), got ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Verify tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq '.status')
          case "${status}" in
            behind|identical) ;;
            *)
              echo "::error::Release tags must point to a commit on main (${GITHUB_REF_NAME} -> ${GITHUB_SHA}, compare status: ${status})"
              exit 1
              ;;
          esac

      - uses: hynek/build-and-inspect-python-package@v3.0.1
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.SETUPTOOLS_SCM_PRETEND_VERSION }}
        with:
          python-version: '3.12'

  create-github-release:
    name: Create GitHub Release
    needs: build-and-inspect-package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Extract changelog notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/extract-changelog-notes.sh
          .github/scripts/extract-changelog-notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  upload-to-pypi:
    name: Upload package to PyPI
    needs: build-and-inspect-package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
