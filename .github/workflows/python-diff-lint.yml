---
name: Lint

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python (ruff, pylint, mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify uv.lock matches pyproject.toml
        run: |
          pip install uv
          make lock-check

      - name: Ruff lint
        run: ruff check pulp_tool tests

      - name: Ruff format
        run: ruff format --check pulp_tool tests

      - name: Pylint (errors only)
        run: pylint pulp_tool tests --errors-only

      - name: Mypy
        run: mypy pulp_tool tests --show-error-codes

  test-diff-coverage:
    name: Tests and diff coverage (100%)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Repository checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests and diff coverage
        run: make test-diff-coverage COMPARE_BRANCH=origin/${{ github.base_ref }}

  repo-lint:
    name: YAML, shell, spelling, Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v7

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint codespell
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64 \
            -o "$HOME/.local/bin/hadolint"
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Yamllint
        run: yamllint --strict .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Codespell
        run: codespell --skip=uv.lock,htmlcov,.git --ignore-words=.codespell-ignore-words.txt

      - name: Hadolint
        run: hadolint --ignore DL3041 --ignore DL3013 Dockerfile

  tekton-lint:
    name: Tekton embedded scripts (Checkton)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Repository checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkton
        uses: chmeliik/checkton@v0.4.0
        with:
          fail-on-findings: true
